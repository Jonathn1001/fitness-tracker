# Render Blueprint — create via https://dashboard.render.com → New → Blueprint
#
# Free tier notes:
# - The web service sleeps after 15 min idle (first request after sleep
#   takes ~50s to wake).
# - Database is Neon (https://neon.tech), permanent free tier — no 30-day
#   expiry. Create a Neon project, copy its pooled connection string, and
#   paste it as DATABASE_URL in the Render dashboard (it is sync:false here
#   so the value is never committed to git).
# - The public URL is <name>.onrender.com and must be globally unique. If
#   "fitness-tracker-api" is taken, Render assigns a suffixed name — use the
#   URL Render shows and update the repo variable VITE_API_URL to match.
services:
  - type: web
    name: fitness-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    # NOT gated by CI. Render watches master directly, so a push deploys the
    # backend whether or not .github/workflows/checks.yml passed — unlike the
    # frontend, which deploy.yml holds behind those checks.
    #
    # To gate it: set this to false, add a Render deploy hook URL as the
    # RENDER_DEPLOY_HOOK_URL repo secret, add a deploy-backend job to
    # deploy.yml with `needs: checks` that curls it, then re-sync the
    # blueprint. Until all of that is in place, flipping this flag alone just
    # stops backend deploys.
    autoDeploy: true
    buildCommand: corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm run build
    startCommand: node_modules/.bin/prisma migrate deploy && node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon pooled connection string — set in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard
      - key: FRONTEND_URL
        value: https://jonathn1001.github.io

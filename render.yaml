# Render Blueprint — create via https://dashboard.render.com → New → Blueprint
# Free tier notes: the web service sleeps after 15 min idle (first request
# after sleep takes ~1 min); the free Postgres instance expires after 30 days
# unless upgraded.
services:
  - type: web
    name: fitness-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    autoDeploy: true
    buildCommand: corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm run build
    startCommand: pnpm exec prisma migrate deploy && node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitness-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard
      - key: FRONTEND_URL
        value: https://jonathn1001.github.io

databases:
  - name: fitness-tracker-db
    plan: free
    databaseName: fitness
    user: fitness

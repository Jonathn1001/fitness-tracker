name: Checks

# The single definition of "is this code good enough to ship".
# Called by ci.yml on pull requests and by deploy.yml before it publishes,
# so the deploy runs exactly the checks the PR ran — no drift between them.
on:
  workflow_call:

jobs:
  backend:
    name: Backend — lint, typecheck, unit, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.build.json

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  backend-e2e:
    name: Backend — e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness
          POSTGRES_DB: fitness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitness -d fitness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fitness:fitness@localhost:5432/fitness
      # Env validation requires both and rejects them being equal.
      JWT_SECRET: ci-access-token-secret
      JWT_REFRESH_SECRET: ci-refresh-token-secret
      # Only present to satisfy env validation. No e2e test reaches Gemini:
      # the rate-limit check short-circuits before the API call.
      GEMINI_API_KEY: ci-placeholder-not-a-real-key

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed exercise and round-type libraries
        # Signup seeds a weekly plan per user, which reads from these tables.
        run: pnpm exec prisma db seed

      - name: E2E
        run: pnpm run test:e2e

  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Gate. CI only runs on pull_request, so without this a direct push to
  # master — or a merge that raced another — published unverified code.
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  # Backend deploys itself: Render watches master via render.yaml (autoDeploy),
  # which means the backend ships regardless of the result of this workflow.
  # See docs note in render.yaml.
  deploy-frontend:
    name: Deploy frontend to GitHub Pages
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      # The codebase course is three static files with no build step. It ships
      # under /course on the same Pages site rather than a second host, so the
      # app and its explanation can never drift onto different URLs. Copied
      # explicitly — the source directory also holds the build parts, which
      # have no business being published.
      - name: Publish the codebase course under /course
        run: |
          mkdir -p dist/course
          cp ../fitness-tracker-course/index.html \
             ../fitness-tracker-course/styles.css \
             ../fitness-tracker-course/main.js \
             dist/course/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v5

  # Verify the deploy is actually serving before we call it done.
  smoke-test:
    name: Post-deploy smoke test
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Frontend responds 200
        run: |
          url="${{ needs.deploy-frontend.outputs.page_url }}"
          echo "Checking $url"
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Frontend did not return 200 at $url"
          exit 1

      - name: Course responds 200
        run: |
          url="${{ needs.deploy-frontend.outputs.page_url }}course/"
          echo "Checking $url"
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Course did not return 200 at $url"
          exit 1

      - name: Backend /health responds 200
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$API_URL" ] || echo "$API_URL" | grep -q '\.invalid'; then
            echo "VITE_API_URL not configured to a real backend yet — skipping API check."
            exit 0
          fi
          echo "Checking $API_URL/health (Render free tier may cold-start ~50s)"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/health")
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::Backend /health did not return 200 at $API_URL"
          exit 1
